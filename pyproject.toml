[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ridecast"
version = "0.1.0"
description = "Reproducible ride-hailing demand simulation and TensorFlow forecasting backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "numpy==2.1.3", "pandas==2.3.2", "pyarrow==21.0.0",
  "shapely==2.1.1", "python-multipart==0.0.20"
]

[project.optional-dependencies]
ml = ["tensorflow==2.19.1", "keras==3.11.3", "protobuf==5.29.5"]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.10"]

[project.scripts]
ridecast = "ridecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: trains a small real TensorFlow model"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
